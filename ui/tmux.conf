# tmux settings for `boxen ui`: its own server (tmux -L boxen), started with
# -f pointing here, so your ~/.tmux.conf is never read and nothing in it
# changes how the dashboard behaves. `boxen ui` re-reads this file each time.
#
#   F1        the dashboard          F2 / F3   previous / next window
#   Ctrl+B 0  the dashboard too (for when a program wants the F-keys: htop, mc)
#   Ctrl+B n/p next / previous window
#   Ctrl+B d  detach (everything keeps running; `boxen ui` reattaches)
#   mouse     click a tab below to switch, scroll to see history

set -g prefix C-b
set -g mouse on
set -g escape-time 10
set -g history-limit 20000
set -g focus-events on
set -g default-terminal "tmux-256color"
# The whole list (tmux 3.4's defaults, then true colour), set rather than
# appended: `boxen ui` re-reads this file each time, and -a would add the
# same entries again every time.
set -s terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm*:RGB,*256col*:RGB,alacritty*:RGB,kitty*:RGB,iterm*:RGB,wezterm*:RGB"

# A window closes when its command exits; boxen ui wraps the commands it
# starts so their last output stays until you press Enter.
set -g remain-on-exit off
# What runs in a window can't reach your terminal around tmux (passthrough)
# or write your clipboard (OSC 52).
set -g allow-passthrough off
set -g set-clipboard off
# Window names are what boxen ui finds its windows by: keep them as given.
set -g allow-rename off
set -g automatic-rename off
set -g renumber-windows on
set -g base-index 0

bind -n F1 select-window -t :=dashboard
bind 0 select-window -t :=dashboard
bind -n F2 previous-window
bind -n F3 next-window

# The status bar: the windows as tabs.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 20
set -g status-left "#[bg=colour33,fg=colour231,bold] boxen #[default] "
set -g status-right-length 60
set -g status-right "#[fg=colour244]F1 (C-b 0) dashboard  F2/F3 prev/next  C-b d detach "
set -g window-status-separator ""
set -g window-status-format "#[fg=colour250] #I #W "
set -g window-status-current-format "#[bg=colour250,fg=colour235,bold] #I #W "
set -g window-status-activity-style "fg=colour214"
set -g message-style "bg=colour33,fg=colour231"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour33"
