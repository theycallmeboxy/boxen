# Example compose.override.yaml for __NAME__. Copy this file to
# compose.override.yaml (same folder) and edit; `boxen up __NAME__` applies
# it. Only you can edit it: the project's agent can't write this folder.
#
# services:
#   env:
#     # Open a dev server to the VM (and so the LAN): http://<vm>:3000
#     ports:
#       - "3000:3000"
#     # Limits (memory and CPU need cgroup v2 delegation; install.sh sets it up)
#     mem_limit: 8g
#     cpus: 4
#   # A sidecar from services.yaml, by its service name:
#   postgres:
#     ports:
#       - "127.0.0.1:5432:5432"
