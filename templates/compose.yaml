# boxen-format: 2
# Generated by boxen; rewritten on self-update. Put your changes in
# compose.override.yaml next to this file (service `env`), which only you can
# edit: ports to the VM or LAN, host mounts, memory and CPU limits. See
# compose.override.example.yaml.
#
# The build container for __NAME__. Its definition is in the project folder,
# __SRC__/.boxen/ (Dockerfile, services.yaml), which the project's agent may
# edit; boxen renders the sidecars from services.yaml into
# compose.services.yaml, merged in between.
name: boxen-__NAME__

services:
  env:
    build:
      context: __SRC__/.boxen
      dockerfile: Dockerfile
    image: boxen-env-__NAME__:latest
    container_name: boxen.__NAME__.env
    hostname: __NAME__
    init: true
    command: ["sleep", "infinity"]
    # Comes back after VM reboots. `boxen down __NAME__` stops it for good.
    restart: unless-stopped
    # Root in here is you on the VM (rootless Docker): files written in the
    # project folder are yours, and apt works.
    user: "0:0"
    working_dir: __SRC__
    environment:
      BOXEN_PROJECT: __NAME__
      TZ: __TZ__
    volumes:
      # The project folder, at the same path as on the VM. Nothing else of
      # the VM is mounted.
      - __SRC__:__SRC__
      # /root: toolchains and caches installed here (rustup, nvm, pip
      # --user, ~/.cache) survive rebuilds.
      - home:/root
    labels:
      boxen.project: __NAME__
    security_opt:
      - no-new-privileges:true
    # Keeps a runaway build or fork bomb from taking down the VM.
    pids_limit: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: boxen.__NAME__
    labels:
      boxen.project: __NAME__

volumes:
  home:
    name: boxen.__NAME__.home
    labels:
      boxen.project: __NAME__
