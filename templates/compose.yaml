# Generated by boxen; rewritten on self-update. Put your changes in
# compose.override.yaml next to this file (same service name `claude`);
# Docker merges it automatically. See compose.override.example.yaml.
# The project's own environment is in env/ (Dockerfile, services.yaml),
# which the container sees at /boxen and may edit; boxen renders the
# sidecars from services.yaml into compose.services.yaml, merged in between.
name: boxen-__NAME__

services:
  claude:
    build: ./env
    image: boxen-proj-__NAME__:latest
    container_name: boxen-__NAME__
    hostname: __NAME__
    init: true
    # Comes back after VM reboots, and after the Remote Control server exits
    # following a long network outage. `boxen down` stops it for good.
    restart: unless-stopped
    tty: true
    stdin_open: true
    # Pinned: a `USER root` left on in env/Dockerfile doesn't make the
    # container run as root.
    user: "__UID__:__GID__"
    # The code sits at the same path inside as on the VM. Claude keys history
    # and auto memory by path, and git worktrees store absolute paths.
    working_dir: __SRC__
    # Remote Control server; shows up in the Claude app's Code tab as "__NAME__".
    # --spawn is set so the server never stops to ask (it runs unattended).
    # same-dir: sessions work in this folder. worktree: each session gets its
    # own git worktree. Also optional: "--permission-mode=acceptEdits".
    command: ["claude", "remote-control", "--name", "__NAME__", "--spawn=same-dir"]
    env_file:
      # Shared by every project: git identity, TZ.
      - path: ../../boxen.env
        required: true
      # Optional per-project overrides.
      - path: ./project.env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: __CHOME__/.claude
      BOXEN_PROJECT: __NAME__
      # The boxen agent's socket for this project (restart, update, show,
      # logs, ls: this project only). boxen-entry links ~/.local/bin/boxen
      # to the client when this is set.
      BOXEN_AGENT_SOCK: /run/boxen-agent/agent.sock
      # ~/.local/bin last: the boxen client link lives there, nothing else
      # provides `boxen`, and a volume-resident PATH entry shouldn't shadow
      # the system.
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:__CHOME__/.local/bin
    volumes:
      # The home folder, kept per project: tool installs survive rebuilds.
      # Filled from the image's home the first time; the mounts below sit
      # on top of it.
      - home:__CHOME__
      - __SRC__:__SRC__
      # Shared Claude login, settings, CLAUDE.md, skills and memory.
      - claude-config:__CHOME__/.claude
      # This project's short-lived GitHub token, refreshed by boxen on the VM.
      - ./token:/run/boxen:ro
      # This project's environment (Dockerfile, services.yaml), editable
      # from inside; applied with `boxen update` / `boxen restart`.
      - ./env:/boxen
      # This project's socket to the boxen agent on the VM: agent.sock in here.
      - ./agent:/run/boxen-agent:ro
    security_opt:
      - no-new-privileges:true
    # Keeps a runaway build or fork bomb from taking down the VM.
    pids_limit: 4096
    # Limits (mem_limit, cpus) and other changes go in compose.override.yaml.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-config:
    external: true
  home:
    name: boxen-home-__NAME__
