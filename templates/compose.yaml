# Generated by `boxen new __NAME__`. Safe to edit; apply with `boxen rebuild __NAME__`.
name: boxen-__NAME__

services:
  claude:
    build: .
    image: boxen-proj-__NAME__:latest
    container_name: boxen-__NAME__
    hostname: __NAME__
    init: true
    # Comes back after VM reboots, and after the Remote Control server exits
    # following a long network outage. `boxen down` stops it for good.
    restart: unless-stopped
    tty: true
    stdin_open: true
    working_dir: __CHOME__/src/__NAME__
    # Remote Control server; shows up in the Claude app's Code tab as "__NAME__".
    # Optional flags: "--permission-mode", "acceptEdits"  |  "--spawn", "worktree"
    command: ["claude", "remote-control", "--name", "__NAME__"]
    env_file: ../../boxen.env
    environment:
      CLAUDE_CONFIG_DIR: __CHOME__/.claude
    volumes:
      # The repo, at a path unique to this project (Claude keys history and
      # auto memory by path).
      - __SRC__:__CHOME__/src/__NAME__
      # Shared Claude login, settings, CLAUDE.md, skills and memory.
      - claude-config:__CHOME__/.claude
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-config:
    external: true
