# Generated by boxen; rewritten on self-update. Put your changes in
# compose.override.yaml next to this file (same service name `claude`);
# Docker merges it automatically. See compose.override.example.yaml.
name: boxen-__NAME__

services:
  claude:
    build: .
    image: boxen-proj-__NAME__:latest
    container_name: boxen-__NAME__
    hostname: __NAME__
    init: true
    # Comes back after VM reboots, and after the Remote Control server exits
    # following a long network outage. `boxen down` stops it for good.
    restart: unless-stopped
    tty: true
    stdin_open: true
    # The code sits at the same path inside as on the VM. Claude keys history
    # and auto memory by path, and git worktrees store absolute paths.
    working_dir: __SRC__
    # Remote Control server; shows up in the Claude app's Code tab as "__NAME__".
    # --spawn is set so the server never stops to ask (it runs unattended).
    # same-dir: sessions work in this folder. worktree: each session gets its
    # own git worktree. Also optional: "--permission-mode=acceptEdits".
    command: ["claude", "remote-control", "--name", "__NAME__", "--spawn=same-dir"]
    env_file:
      # Shared by every project: git identity, TZ.
      - path: ../../boxen.env
        required: true
      # Optional per-project overrides.
      - path: ./project.env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: __CHOME__/.claude
      BOXEN_PROJECT: __NAME__
    volumes:
      - __SRC__:__SRC__
      # Shared Claude login, settings, CLAUDE.md, skills and memory.
      - claude-config:__CHOME__/.claude
      # This project's short-lived GitHub token, refreshed by boxen on the VM.
      - ./token:/run/boxen:ro
    security_opt:
      - no-new-privileges:true
    # Keeps a runaway build or fork bomb from taking down the VM.
    pids_limit: 4096
    # Limits (mem_limit, cpus) and other changes go in compose.override.yaml.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-config:
    external: true
