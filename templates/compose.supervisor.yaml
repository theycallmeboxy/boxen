# Generated by boxen for the supervisor project; rewritten on self-update.
# Put your changes in compose.override.yaml next to this file (same service
# name `claude`); Docker merges it automatically.
#
# Same as a project's compose.yaml, except: no GitHub token; the boxen agent's
# socket is mounted at /run/boxen, where the container's `boxen` command
# (a restricted client, see BOXEN_SUPERVISOR) reaches it.
name: boxen-__NAME__

services:
  claude:
    build: ./env
    image: boxen-proj-__NAME__:latest
    container_name: boxen-__NAME__
    hostname: __NAME__
    init: true
    restart: unless-stopped
    tty: true
    stdin_open: true
    # Pinned: a `USER root` left on in env/Dockerfile doesn't make the
    # container run as root.
    user: "__UID__:__GID__"
    working_dir: __SRC__
    # Shows up in the Claude app's Code tab as "boxen supervisor".
    command: ["claude", "remote-control", "--name", "boxen supervisor", "--spawn=same-dir"]
    env_file:
      - path: ../../boxen.env
        required: true
      - path: ./project.env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: __CHOME__/.claude
      BOXEN_PROJECT: __NAME__
      # boxen-entry links ~/.local/bin/boxen to the client when this is set.
      BOXEN_SUPERVISOR: "1"
      # ~/.local/bin last: the boxen client link lives there, nothing else
      # provides `boxen`, and a volume-resident PATH entry shouldn't shadow
      # the system.
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:__CHOME__/.local/bin
    volumes:
      # The home folder, kept per project: tool installs survive rebuilds.
      - home:__CHOME__
      - __SRC__:__SRC__
      # Shared Claude login, settings, CLAUDE.md, skills and memory.
      - claude-config:__CHOME__/.claude
      # The boxen agent's socket (boxen-agentd on the VM): agent.sock in here.
      - __BOXEN_HOME__/agent:/run/boxen:ro
      # The supervisor's instructions, written by boxen; read-only so a
      # session can't rewrite its own rules.
      - ./CLAUDE.md:__SRC__/CLAUDE.md:ro
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-config:
    external: true
  home:
    name: boxen-home-__NAME__
